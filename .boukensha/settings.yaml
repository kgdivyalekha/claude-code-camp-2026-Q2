tasks:
  player:
    provider: anthropic
    model: claude-haiku-4-5
    prompt_override:
      system: true

mud:
  host: localhost
  port: 4000
  username: queen
  password: password

# ==============================================================================
# TOKEN ECONOMY & TOOL GATING
# ==============================================================================
tokens:
  gate_tools: true

  # Phase-based tool exposure
  phases:
    exploring: [perception, movement, communication, utility]  # includes send_raw, practice
    fighting: [perception, movement, combat]
    trading: [perception, inventory, utility]

  # Tools always visible (foundation to prevent deadlock)
  always_visible:
    - "*__look"
    - "*__move"
    - "*__check"
    - "*__drink"
    - "*__send_raw"   # Escape hatch for arbitrary MUD commands

# ==============================================================================
# PERMISSIONS & AUDIT
# ==============================================================================
permissions:
  default: allow

  rules:
    # Allow exploration tools
    - allow: ["*__look", "*__examine", "*__check", "*__move", "*__drink", "*__send_raw"]

    # Restrict irreversible commands through send_raw
    - deny: "*__send_raw"
      when:
        command: "^\\s*(quit|delete|shutdown|purge)"
      reason: "irreversible or out-of-character"

# ==============================================================================
# MCP SERVERS
# ==============================================================================
# Used by week1_baseline/ruby/10_standard_tool_library and later steps: the
# agent owns no tools of its own, so MUD gameplay tools come from spawning the
# mud-manager daemon as an MCP server. `command` is an absolute path since
# every launcher in this repo (bin/ruby/*, bin/python/*) cd's into the step
# directory before running — a relative path only works if you happen to
# launch from the repo root yourself.
mcp_servers:
  mud:
    command: ruby
    args:    [/home/system/claude-code-camp-2026-Q2/week0_explore/mud_manager/bin/mud-manager, --mcp]
    prefix:  tbamud
    required: true
    env:
      MUD_HOST:     localhost
      MUD_PORT:     4000
      MUD_NAME:     queen
      MUD_PASSWORD: password

  # Files. A third-party server nobody wrote boukensha code for — which is the
  # whole point: file access is a server you plug in, not a feature the agent
  # was born with. Edit the last arg to change what it can reach.
  #
  # required: false so a missing npx is a warning, not a dead agent.
  filesystem:
    command:  npx
    args:     [-y, "@modelcontextprotocol/server-filesystem", /tmp]
    prefix:   fs
    required: false
